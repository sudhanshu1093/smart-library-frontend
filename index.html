<!DOCTYPE html>
<html>
<head>
<title>Smart Library Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="header">
<img src="logo.png" class="logo">
<p class="tagline">
THE WORLD IS <b>HERE</b>. WHERE ARE <b>YOU</b>?
</p>

</div>

<div class="center-box">
<div class="login-card">
<div class="icon-circle">
<img src="earth.png" class="earth">
<img src="people.png" class="people">
</div>

<h2 style="color:#2C5F9E;">Unlock Knowledge</h2>

<form id="loginForm">

<select class="field" id="role">
<option value="">Select Role</option>
<option value="student">Student</option>
<option value="librarian">Librarian</option>
</select>

<input class="field" id="username" type="text" placeholder="System ID" maxlength="10" pattern="[0-9]{10}">

<input class="field" id="password" type="password" placeholder="Password">

<button class="login-btn" type="submit">Login</button>

</form>

<br>

<a href="register.html" class="register-btn">Register</a>

</div>

</div>

<script>

const BASE_URL = "https://smart-library-backend-3762.onrender.com";

document.getElementById("loginForm").addEventListener("submit", async function(e){
  e.preventDefault();   // Stops page from jumping

  let role = document.getElementById("role").value;
  let username = document.getElementById("username").value.trim();
  let password = document.getElementById("password").value.trim();

  // Validation
  if(!role){
    alert("Please select a role!");
    return;
  }

  if(!/^[0-9]{10}$/.test(username)){
    alert("System ID must be exactly 10 digits");
    return;
  }

  if(!password){
    alert("Please enter your password!");
    return;
  }

  try {
    // Show a loading indication if Render is waking up (optional)
    const res = await fetch(`${BASE_URL}/login`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        role,
        username,
        password
      })
    });

    // Check if the response is valid JSON
    const contentType = res.headers.get("content-type");
    if (!contentType || !contentType.includes("application/json")) {
      throw new Error("Server is waking up or starting from cold storage. Please try again in 30 seconds.");
    }

    const data = await res.json();

    if (res.ok && data.success) {
      localStorage.setItem("token", data.token);
      localStorage.setItem("username", username);
      localStorage.setItem("role", role);

      if (role === "student") {
        window.location.href = "student.html";
      } else if (role === "librarian") {
        window.location.href = "librarian.html";
      }
    } else {
      // Safe fallback: uses data.message, data.error, or a default string instead of "undefined"
      alert(data.message || data.error || "Login failed. Please check your credentials.");
    }

  } catch (error) {
    console.error("Login error:", error);
    alert(error.message || "Server error! Backend might be waking up from sleep. Please wait a moment and try again.");
  }

});

</script>
</body>
</html>
